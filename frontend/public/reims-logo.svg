<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon Container -->
  <g transform="translate(10, 10)">
    <!-- Box/Container representing inventory -->
    <rect x="0" y="5" width="35" height="35" rx="3" fill="url(#iconGradient)" stroke="#059669" stroke-width="1"/>
    
    <!-- Inventory items inside box -->
    <rect x="5" y="10" width="8" height="3" fill="white" opacity="0.9"/>
    <rect x="5" y="15" width="10" height="3" fill="white" opacity="0.9"/>
    <rect x="5" y="20" width="7" height="3" fill="white" opacity="0.9"/>
    <rect x="5" y="25" width="9" height="3" fill="white" opacity="0.9"/>
    
    <!-- Research symbol (microscope/eye) -->
    <circle cx="25" cy="20" r="6" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <circle cx="25" cy="20" r="3" fill="white" opacity="0.9"/>
    
    <!-- Extension symbol (network/connections) -->
    <path d="M 20 30 L 25 35 L 30 30" stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
    <circle cx="20" cy="30" r="2" fill="white" opacity="0.9"/>
    <circle cx="30" cy="30" r="2" fill="white" opacity="0.9"/>
  </g>
  
  <!-- REIMS Text -->
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#logoGradient)">
    REIMS
  </text>
  
  <!-- Tagline -->
  <text x="55" y="42" font-family="Arial, sans-serif" font-size="8" font-weight="normal" fill="#6b7280">
    Research Extension Inventory Management
  </text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="20" r="2" fill="#10b981" opacity="0.6"/>
  <circle cx="50" cy="30" r="1.5" fill="#059669" opacity="0.4"/>
  <circle cx="50" cy="38" r="1" fill="#34d399" opacity="0.3"/>
</svg>
