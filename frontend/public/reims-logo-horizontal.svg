<svg width="250" height="50" viewBox="0 0 250 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(8, 8)">
    <rect x="0" y="4" width="30" height="30" rx="2" fill="url(#iconGradient)" stroke="#059669" stroke-width="1"/>
    
    <!-- Inventory items -->
    <rect x="4" y="8" width="7" height="2.5" fill="white" opacity="0.9"/>
    <rect x="4" y="12" width="9" height="2.5" fill="white" opacity="0.9"/>
    <rect x="4" y="16" width="6" height="2.5" fill="white" opacity="0.9"/>
    <rect x="4" y="20" width="8" height="2.5" fill="white" opacity="0.9"/>
    
    <!-- Research symbol -->
    <circle cx="22" cy="17" r="5" fill="none" stroke="white" stroke-width="1.8" opacity="0.9"/>
    <circle cx="22" cy="17" r="2.5" fill="white" opacity="0.9"/>
    
    <!-- Extension network -->
    <path d="M 18 26 L 22 30 L 26 26" stroke="white" stroke-width="1.8" fill="none" opacity="0.9"/>
    <circle cx="18" cy="26" r="1.8" fill="white" opacity="0.9"/>
    <circle cx="26" cy="26" r="1.8" fill="white" opacity="0.9"/>
  </g>
  
  <!-- REIMS Text -->
  <text x="50" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#logoGradient)">
    REIMS
  </text>
  
  <!-- Full name below -->
  <text x="50" y="42" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#6b7280">
    Research Extension Inventory Management System
  </text>
</svg>
